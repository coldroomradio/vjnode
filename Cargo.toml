[package]
name = "vjnode"
version = "0.1.0"
edition = "2021"

# Pinned to specific versions on purpose — wgpu/winit APIs shift between
# minor versions often. If you bump these later, expect a few small
# compile fixes (usually renamed methods, not logic changes).
[dependencies]
wgpu = "0.19"
winit = "0.29"
pollster = "0.3"
env_logger = "0.11"
bytemuck = { version = "1.14", features = ["derive"] }
log = "0.4"
cpal = "0.15"
rustfft = "6.2"
egui = "0.27"
egui-wgpu = "0.27"
egui-winit = "0.27"

[profile.release]
opt-level = 3
lto = true
